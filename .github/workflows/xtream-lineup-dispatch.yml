name: Build Xtream Lineup Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build
        required: true
        type: string
        default: feat/xtream-lineup-manager
  push:
    branches: [main]
    paths:
      - '.github/workflows/xtream-lineup-dispatch.yml'

permissions:
  contents: read

concurrency:
  group: xtream-lineup-dispatch
  cancel-in-progress: false

jobs:
  validate:
    name: Validate feature branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'feat/xtream-lineup-manager' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Core unit tests
        run: pnpm -F @aiostreams/core test
      - name: Build packages
        run: pnpm run build
      - name: Frontend typecheck
        run: pnpm -F @aiostreams/frontend typecheck

  publish:
    name: Build and publish GHCR (linux/amd64)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'feat/xtream-lineup-manager' }}
      - name: Read checked-out revision
        id: source
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push isolated test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiostreams:xtream-lineup-test
            ghcr.io/${{ github.repository_owner }}/aiostreams:xtream-lineup-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Xtream Lineup Manager test build
          cache-from: type=gha,scope=xtream-lineup
          cache-to: type=gha,mode=max,scope=xtream-lineup
