name: Xtream Lineup Test Image

# Publish to a dedicated GHCR package: the existing aiostreams package denied write_package.
# Never overwrite upstream registry images, latest or nightly.
on:
  push:
    branches:
      - feat/xtream-lineup-manager
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xtream-lineup-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Core tests
        run: pnpm -F @aiostreams/core test
      - name: Build all packages
        run: pnpm run build
      - name: Frontend typecheck
        run: pnpm -F @aiostreams/frontend typecheck

  docker:
    name: Publish test Docker image (amd64)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiostreams-xtream-lineup-test:xtream-lineup-test
            ghcr.io/${{ github.repository_owner }}/aiostreams-xtream-lineup-test:xtream-lineup-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=xtream-lineup-amd64
          cache-to: type=gha,mode=max,scope=xtream-lineup-amd64
